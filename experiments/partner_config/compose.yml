services:
  partner-beijing_urban:
    image: acps-demo-partners:latest
    user: "1004:1004"
    working_dir: /work/demo-partner
    command: ["python","-m","partners.main","beijing_urban"]
    env_file: ./llm.env
    environment:
      PYTHONPATH: /work/demo-partner:/work/acps-sdk
      AMP_LOG_DIR: /work/amp-logs/roster_partner
      EFFECT_OUTBOX: /outbox/effects.jsonl
    volumes:
      - /data/caiyizhang/acps-public-demo/src/demo-partner:/work/demo-partner:ro
      - /data/caiyizhang/acps-public-demo/src/acps-sdk:/work/acps-sdk:ro
      - /data/caiyizhang/ACPs-community/monitor/logs:/work/amp-logs
      - /data/caiyizhang/acps-public-demo/outbox:/outbox
      - /data/caiyizhang/acps-public-demo/roster/runtime/beijing_urban/config.toml:/work/demo-partner/partners/online/beijing_urban/config.toml:ro
      - /data/caiyizhang/acps-public-demo/roster/runtime/beijing_urban/acs.json:/work/demo-partner/partners/online/beijing_urban/acs.json:ro
      - /data/caiyizhang/acps-public-demo/roster/certs/beijing_urban-server.pem:/certs/server.pem:ro
      - /data/caiyizhang/acps-public-demo/roster/keyfiles/beijing_urban-server.key:/certs/server.key:ro
      - /data/caiyizhang/acps-public-demo/keyfiles/trust-bundle.pem:/certs/trust-bundle.pem:ro
    ports:
      - "0.0.0.0:9540:9540"
    restart: unless-stopped
