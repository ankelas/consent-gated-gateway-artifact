<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="1000" viewBox="0 0 1140 1000"><rect width="1140" height="1000" fill="white" /><text x="570.0" y="24.0" fill="#203448" font-family="Arial, sans-serif" font-size="25" font-weight="bold" text-anchor="middle" dominant-baseline="central">GATEWAY REQUEST PROCESSING FLOW</text><text x="570.0" y="58.0" fill="#586B7B" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" dominant-baseline="central">Reference design; terminal outcomes share one processing endpoint</text><rect x="410" y="88" width="270" height="40" rx="20" fill="#EAF5F2" stroke="#14877F" stroke-width="1.5" /><text x="545.0" y="108.0" fill="#14877F" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" dominant-baseline="central">Receive inbound event</text><rect x="310" y="91" width="34" height="34" rx="17" fill="#FCF4E6" stroke="#B97712" stroke-width="1.5" /><text x="327.0" y="108.0" fill="#B97712" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" dominant-baseline="central">A</text><polyline points="344,108 410,108" fill="none" stroke="#B97712" stroke-width="2" /><polygon points="410,108 400.9955289764732,112.3496553411123 400.9955289764732,103.6503446588877" fill="#B97712" /><rect x="375" y="156" width="340" height="72" rx="9" fill="#EDF4F8" stroke="#28658D" stroke-width="1.5" /><text x="545.0" y="174.5" fill="#28658D" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" dominant-baseline="central">Authenticate</text><text x="545.0" y="207.0" fill="#203448" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="central">Verify event; reject invalid ingress</text><rect x="375" y="268" width="340" height="72" rx="9" fill="#EDF4F8" stroke="#28658D" stroke-width="1.5" /><text x="545.0" y="286.5" fill="#28658D" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" dominant-baseline="central">Resolve context</text><text x="545.0" y="319.0" fill="#203448" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="central">Bind caller/session; deduplicate; discover</text><rect x="375" y="400" width="340" height="72" rx="9" fill="#EDF4F8" stroke="#28658D" stroke-width="1.5" /><text x="545.0" y="418.5" fill="#28658D" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" dominant-baseline="central">Apply policy</text><text x="545.0" y="451.0" fill="#203448" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="central">Check route, consent and cancellation</text><rect x="375" y="560" width="340" height="72" rx="9" fill="#EDF4F8" stroke="#28658D" stroke-width="1.5" /><text x="545.0" y="578.5" fill="#28658D" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" dominant-baseline="central">Validate endpoint</text><text x="545.0" y="611.0" fill="#203448" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="central">Verify AIC, endpoint and mTLS</text><rect x="375" y="680" width="340" height="72" rx="9" fill="#EDF4F8" stroke="#28658D" stroke-width="1.5" /><text x="545.0" y="698.5" fill="#28658D" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" dominant-baseline="central">Execute AIP task</text><text x="545.0" y="731.0" fill="#203448" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="central">Claim key; execute / resume task</text><polyline points="545,128 545,156" fill="none" stroke="#203448" stroke-width="2" /><polygon points="545,156 540.6503446588877,146.99552897647322 549.3496553411123,146.99552897647322" fill="#203448" /><polyline points="545,228 545,268" fill="none" stroke="#203448" stroke-width="2" /><polygon points="545,268 540.6503446588877,258.9955289764732 549.3496553411123,258.9955289764732" fill="#203448" /><text x="627.0" y="248.0" fill="#586B7B" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central">valid</text><polyline points="545,340 545,400" fill="none" stroke="#203448" stroke-width="2" /><polygon points="545,400 540.6503446588877,390.9955289764732 549.3496553411123,390.9955289764732" fill="#203448" /><text x="627.0" y="370.0" fill="#586B7B" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central">new event / eligible route</text><polyline points="545,472 545,560" fill="none" stroke="#203448" stroke-width="2" /><polygon points="545,560 540.6503446588877,550.9955289764732 549.3496553411123,550.9955289764732" fill="#203448" /><text x="627.0" y="516.0" fill="#586B7B" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central">authorized</text><polyline points="545,632 545,680" fill="none" stroke="#203448" stroke-width="2" /><polygon points="545,680 540.6503446588877,670.9955289764732 549.3496553411123,670.9955289764732" fill="#203448" /><text x="627.0" y="656.0" fill="#586B7B" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central">verified</text><rect x="795" y="156" width="300" height="72" rx="9" fill="#FAEFED" stroke="#B54C41" stroke-width="1.5" /><text x="945.0" y="174.5" fill="#B54C41" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" dominant-baseline="central">Rejected</text><text x="945.0" y="207.0" fill="#203448" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="central">Invalid signature / malformed event</text><polyline points="715,192 795,192" fill="none" stroke="#B54C41" stroke-width="2" /><polygon points="795,192 785.9955289764732,196.3496553411123 785.9955289764732,187.6503446588877" fill="#B54C41" /><polyline points="1095,192 1120,192" fill="none" stroke="#B54C41" stroke-width="1.5" /><rect x="795" y="268" width="300" height="72" rx="9" fill="#FAEFED" stroke="#B54C41" stroke-width="1.5" /><text x="945.0" y="286.5" fill="#B54C41" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" dominant-baseline="central">Not executable</text><text x="945.0" y="319.0" fill="#203448" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="central">No eligible route / invalid context</text><polyline points="715,304 795,304" fill="none" stroke="#B54C41" stroke-width="2" /><polygon points="795,304 785.9955289764732,308.3496553411123 785.9955289764732,299.6503446588877" fill="#B54C41" /><polyline points="1095,304 1120,304" fill="none" stroke="#B54C41" stroke-width="1.5" /><rect x="795" y="400" width="300" height="72" rx="9" fill="#FAEFED" stroke="#B54C41" stroke-width="1.5" /><text x="945.0" y="418.5" fill="#B54C41" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" dominant-baseline="central">Cancelled / denied</text><text x="945.0" y="451.0" fill="#203448" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="central">User declines / policy blocks</text><polyline points="715,436 795,436" fill="none" stroke="#B54C41" stroke-width="2" /><polygon points="795,436 785.9955289764732,440.3496553411123 785.9955289764732,431.6503446588877" fill="#B54C41" /><polyline points="1095,436 1120,436" fill="none" stroke="#B54C41" stroke-width="1.5" /><rect x="795" y="560" width="300" height="72" rx="9" fill="#FAEFED" stroke="#B54C41" stroke-width="1.5" /><text x="945.0" y="578.5" fill="#B54C41" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" dominant-baseline="central">Rejected</text><text x="945.0" y="611.0" fill="#203448" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="central">Endpoint or identity mismatch</text><polyline points="715,596 795,596" fill="none" stroke="#B54C41" stroke-width="2" /><polygon points="795,596 785.9955289764732,600.3496553411123 785.9955289764732,591.6503446588877" fill="#B54C41" /><polyline points="1095,596 1120,596" fill="none" stroke="#B54C41" stroke-width="1.5" /><rect x="20" y="268" width="275" height="72" rx="9" fill="#F2F4F6" stroke="#586B7B" stroke-width="1.5" /><text x="157.5" y="286.5" fill="#586B7B" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" dominant-baseline="central">Reuse existing event</text><text x="157.5" y="319.0" fill="#203448" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="central">Cached response / pending status</text><polyline points="375,304 295,304" fill="none" stroke="#586B7B" stroke-width="2" /><polygon points="295,304 304.0044710235268,299.6503446588877 304.0044710235268,308.3496553411123" fill="#586B7B" /><polyline points="20,304 8,304 8,924 375,924" fill="none" stroke="#586B7B" stroke-width="1.5" /><polygon points="375,924 365.9955289764732,928.3496553411123 365.9955289764732,919.6503446588877" fill="#586B7B" /><rect x="20" y="400" width="275" height="72" rx="9" fill="#FCF4E6" stroke="#B97712" stroke-width="1.5" /><text x="157.5" y="418.5" fill="#B97712" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" dominant-baseline="central">Wait for user</text><text x="157.5" y="451.0" fill="#203448" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="central">Persist context; ask / obtain consent</text><polyline points="375,436 295,436" fill="none" stroke="#B97712" stroke-width="2" /><polygon points="295,436 304.0044710235268,431.6503446588877 304.0044710235268,440.3496553411123" fill="#B97712" /><text x="335.0" y="417.0" fill="#B97712" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central">pending</text><polyline points="157,472 157,503" fill="none" stroke="#B97712" stroke-width="2" stroke-dasharray="7 5" /><polygon points="157,503 152.6503446588877,493.9955289764732 161.3496553411123,493.9955289764732" fill="#B97712" /><rect x="140" y="503" width="34" height="34" rx="17" fill="#FCF4E6" stroke="#B97712" stroke-width="1.5" /><text x="157.0" y="520.0" fill="#B97712" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" dominant-baseline="central">A</text><text x="157.5" y="555.46" fill="#B97712" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central">New user reply via A</text><text x="157.5" y="572.5400000000001" fill="#B97712" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central">Reauthenticate and bind same session</text><rect x="20" y="680" width="275" height="72" rx="9" fill="#FCF4E6" stroke="#B97712" stroke-width="1.5" /><text x="157.5" y="698.5" fill="#B97712" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" dominant-baseline="central">Classify failure</text><text x="157.5" y="731.0" fill="#203448" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="central">Retryable + replay-safe + budget?</text><polyline points="375,716 295,716" fill="none" stroke="#B97712" stroke-width="2" /><polygon points="295,716 304.0044710235268,711.6503446588877 304.0044710235268,720.3496553411123" fill="#B97712" /><text x="335.0" y="696.0" fill="#B97712" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central">error</text><polyline points="157,680 157,638 340,638 340,596 375,596" fill="none" stroke="#B97712" stroke-width="2" stroke-dasharray="7 5" /><polygon points="375,596 365.9955289764732,600.3496553411123 365.9955289764732,591.6503446588877" fill="#B97712" /><text x="174.0" y="618.0" fill="#B97712" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central">yes: backoff; same key; valid consent</text><rect x="20" y="800" width="275" height="72" rx="9" fill="#FAEFED" stroke="#B54C41" stroke-width="1.5" /><text x="157.5" y="818.5" fill="#B54C41" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" dominant-baseline="central">Failed / unresolved</text><text x="157.5" y="851.0" fill="#203448" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="central">No safe retry or budget exhausted</text><polyline points="157,752 157,800" fill="none" stroke="#B54C41" stroke-width="2" /><polygon points="157,800 152.6503446588877,790.9955289764732 161.3496553411123,790.9955289764732" fill="#B54C41" /><text x="199.5" y="777.0" fill="#B54C41" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central">no</text><polyline points="157,872 157,910 375,910" fill="none" stroke="#B54C41" stroke-width="2" /><polygon points="375,910 365.9955289764732,914.3496553411123 365.9955289764732,905.6503446588877" fill="#B54C41" /><polyline points="545,752 545,894" fill="none" stroke="#14877F" stroke-width="2" /><polygon points="545,894 540.6503446588877,884.9955289764732 549.3496553411123,884.9955289764732" fill="#14877F" /><text x="643.0" y="798.0" fill="#14877F" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central">success: return result</text><polyline points="1120,192 1120,924 715,924" fill="none" stroke="#B54C41" stroke-width="1.5" /><polygon points="715,924 724.0044710235268,919.6503446588877 724.0044710235268,928.3496553411123" fill="#B54C41" /><rect x="375" y="894" width="340" height="72" rx="9" fill="#EAF5F2" stroke="#14877F" stroke-width="1.5" /><text x="545.0" y="912.5" fill="#14877F" font-family="Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" dominant-baseline="central">Record handling outcome</text><text x="545.0" y="945.0" fill="#203448" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="central">Reply only to an authenticated context</text><polyline points="545,966 545,973" fill="none" stroke="#14877F" stroke-width="2" /><polygon points="545,973 540.6503446588877,963.9955289764732 549.3496553411123,963.9955289764732" fill="#14877F" /><rect x="455" y="973" width="180" height="25" rx="12" fill="#EAF5F2" stroke="#14877F" stroke-width="1.5" /><text x="545.0" y="985.5" fill="#14877F" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" dominant-baseline="central">End this event</text></svg>