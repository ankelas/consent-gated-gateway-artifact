<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600"><rect width="1000" height="600" fill="white" /><text x="500.0" y="30.0" fill="#203448" font-family="Arial, sans-serif" font-size="25" font-weight="bold" text-anchor="middle" dominant-baseline="central">GATEWAY-SIDE HANDLING COST</text><text x="500.0" y="65.0" fill="#586B7B" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" dominant-baseline="central">Bar = median; each label gives the observed range and n; the model call is shown for scale</text><polyline points="330.0,136 330.0,442" fill="none" stroke="#DCE4EA" stroke-width="1" /><text x="330.0" y="116.0" fill="#586B7B" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" dominant-baseline="central">0.1</text><polyline points="412.0,136 412.0,442" fill="none" stroke="#DCE4EA" stroke-width="1" /><text x="412.0" y="116.0" fill="#586B7B" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" dominant-baseline="central">1</text><polyline points="494.0,136 494.0,442" fill="none" stroke="#DCE4EA" stroke-width="1" /><text x="494.0" y="116.0" fill="#586B7B" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" dominant-baseline="central">10</text><polyline points="576.0,136 576.0,442" fill="none" stroke="#DCE4EA" stroke-width="1" /><text x="576.0" y="116.0" fill="#586B7B" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" dominant-baseline="central">100</text><polyline points="658.0,136 658.0,442" fill="none" stroke="#DCE4EA" stroke-width="1" /><text x="658.0" y="116.0" fill="#586B7B" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" dominant-baseline="central">1000</text><text x="32" y="120.0" fill="#586B7B" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" dominant-baseline="central">milliseconds (log scale)</text><text x="32" y="169.0" fill="#203448" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" dominant-baseline="central">Ingress authentication (reject)</text><rect x="330" y="158" width="55.70138772406432" height="22" rx="4" fill="#14877F" stroke="#14877F" stroke-width="1.5" /><text x="750" y="167.0" fill="#203448" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" dominant-baseline="central">0.48 ms  (0.37–18.08), n=100</text><text x="32" y="231.0" fill="#203448" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" dominant-baseline="central">Deduplication lookup (cache hit)</text><rect x="330" y="220" width="124.54053822735153" height="22" rx="4" fill="#14877F" stroke="#14877F" stroke-width="1.5" /><text x="750" y="229.0" fill="#203448" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" dominant-baseline="central">3.30 ms  (3.07–4.58), n=20</text><text x="32" y="293.0" fill="#203448" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" dominant-baseline="central">AIP identity check (reject)</text><rect x="330" y="282" width="145.11372836203873" height="22" rx="4" fill="#14877F" stroke="#14877F" stroke-width="1.5" /><text x="750" y="291.0" fill="#203448" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" dominant-baseline="central">5.88 ms  (4.42–8.22), n=30</text><text x="32" y="355.0" fill="#203448" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" dominant-baseline="central">AIP request/response (accepted)</text><rect x="330" y="344" width="153.0808968673366" height="22" rx="4" fill="#14877F" stroke="#14877F" stroke-width="1.5" /><text x="750" y="353.0" fill="#203448" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" dominant-baseline="central">7.36 ms  (5.89–9.52), n=30</text><text x="32" y="417.0" fill="#203448" font-family="Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" dominant-baseline="central">First delivery incl. generation</text><rect x="330" y="406" width="398.41493276074857" height="22" rx="4" fill="#586B7B" stroke="#586B7B" stroke-width="1.5" /><text x="750" y="415.0" fill="#203448" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" dominant-baseline="central">7.22 s  (5.42–23.13), n=20</text><text x="500.0" y="561.0" fill="#586B7B" font-family="Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="middle" dominant-baseline="central">Each gateway operation is milliseconds; an end-to-end delivery is dominated by assistant generation.</text></svg>